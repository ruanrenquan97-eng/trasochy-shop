        <path d="M 230,480 C 240,430 280,430 290,480" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
        <circle cx="274" cy="280" r="8" fill="#ffffff" opacity="0.9" />
